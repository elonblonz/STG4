name: build-non-main
run-name: Build the game
on:
  workflow_dispatch:
  pull_request:
  push:
    branches-ignore:
    - "main"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the engine release is the same everywhere
        run: bash scripts/check_engine_ref.sh
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: false
      # `lake build` regenerates the English template; it must match the committed one, or the
      # translations were updated against stale strings. (Its creation date changes daily, so
      # that line doesn't count.)
      - name: Check that .i18n/en/Game.pot is up to date
        run: |
          git diff --exit-code -I '^"POT-Creation-Date: ' -- .i18n/en/Game.pot || { echo "::error::Rebuild the game and update the translations (see README)"; exit 1; }
